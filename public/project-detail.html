<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project — Lesley Liu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="/projects-data.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: #0a0a0a;
  color: #F4F1E8;
  overflow: hidden;
}

/* ===== VIEWER SHELL ===== */
.viewer {
  position: fixed; inset: 0;
  background: #0a0a0a;
  overflow: hidden;
}

.viewer-close {
  position: fixed; top: 20px; left: 20px; z-index: 30;
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08); color: #F4F1E8;
  text-decoration: none; font-size: 20px;
  transition: background 0.2s ease;
}
.viewer-close:hover { background: rgba(255,255,255,0.18); }

.viewer-title {
  position: fixed; top: 28px; left: 50%; transform: translateX(-50%); z-index: 30;
  font-size: 14px; font-weight: 500; color: rgba(244,241,232,0.8);
  max-width: 60vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.viewer-counter {
  position: fixed; top: 20px; right: 20px; z-index: 30;
  font-size: 13px; color: rgba(244,241,232,0.55);
  font-variant-numeric: tabular-nums;
}

/* ===== ONE CONTINUOUS HORIZONTAL STRIP ===== */
/* All board images sit edge-to-edge in a single long row — genuinely one
   long strip, not discrete pages — and you scroll natively along it
   (trackpad, touch swipe, or mouse-drag). */
.viewer-track-wrap {
  position: absolute; inset: 0;
  overflow-x: auto; overflow-y: hidden;
  cursor: grab;
  scroll-behavior: smooth;
  scrollbar-width: none;
}
.viewer-track-wrap::-webkit-scrollbar { display: none; }
.viewer-track-wrap.dragging { cursor: grabbing; scroll-behavior: auto; }

.viewer-track {
  display: flex;
  align-items: center;
  height: 100%;
  width: max-content;
  gap: 0;
  padding: 0 8vw;
}

.viewer-slide {
  flex: 0 0 auto;
  height: 82%;
  display: flex;
}

.viewer-slide img {
  height: 100%; width: auto;
  display: block;
  object-fit: contain;
  pointer-events: none; user-select: none;
  -webkit-user-drag: none;
}

/* ===== NAV ARROWS ===== */
.viewer-arrow {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 25;
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,0.08); color: #F4F1E8;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: background 0.2s ease, opacity 0.2s ease;
}
.viewer-arrow:hover { background: rgba(255,255,255,0.18); }
.viewer-arrow:disabled { opacity: 0; pointer-events: none; }
.viewer-arrow-prev { left: 20px; }
.viewer-arrow-next { right: 20px; }
@media (max-width: 640px) {
  .viewer-arrow { width: 42px; height: 42px; font-size: 16px; }
  .viewer-arrow-prev { left: 10px; }
  .viewer-arrow-next { right: 10px; }
}

/* ===== NEXT PROJECT SLIDE ===== */
/* Sits at the end of the strip, after the last board — its own card
   rather than a board image, linking on to the next project. */
.viewer-next-slide {
  flex: 0 0 auto;
  height: 82%;
  width: clamp(260px, 28vw, 400px);
  margin-left: 6vw;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  display: flex; align-items: flex-end;
  background-size: cover; background-position: center;
  text-decoration: none; color: #F4F1E8;
  box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  transition: transform 0.3s ease;
}
.viewer-next-slide:hover { transform: scale(1.02); }
.viewer-next-slide::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.85) 100%);
}
.viewer-next-slide-inner {
  position: relative; z-index: 1;
  padding: 28px;
}
.viewer-next-label {
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(244,241,232,0.6); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.viewer-next-title {
  font-size: 24px; font-weight: 600; line-height: 1.25;
}

.viewer-empty {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  color: rgba(244,241,232,0.6); font-size: 16px;
}
.viewer-empty a { color: #F4F1E8; text-decoration: underline; }
</style>
</head>
<body>

<div class="viewer" id="viewer">
  <a href="/portfolio-all.html" class="viewer-close" aria-label="Close">&times;</a>
  <div class="viewer-title" id="viewer-title"></div>
  <div class="viewer-counter" id="viewer-counter"></div>

  <button class="viewer-arrow viewer-arrow-prev" id="arrow-prev" aria-label="Previous page">&#8592;</button>
  <button class="viewer-arrow viewer-arrow-next" id="arrow-next" aria-label="Next page">&#8594;</button>

  <div class="viewer-track-wrap" id="viewer-track-wrap">
    <div class="viewer-track" id="viewer-track"></div>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'), 10);
  const project = (typeof PROJECTS !== 'undefined') ? PROJECTS.find(function (p) { return p.id === id; }) : null;

  const wrap = document.getElementById('viewer-track-wrap');
  const track = document.getElementById('viewer-track');
  const titleEl = document.getElementById('viewer-title');
  const counterEl = document.getElementById('viewer-counter');
  const arrowPrev = document.getElementById('arrow-prev');
  const arrowNext = document.getElementById('arrow-next');

  if (!project) {
    document.getElementById('viewer').innerHTML =
      '<div class="viewer-empty"><p>Project not found.</p><a href="/portfolio-all.html">&larr; All projects</a></div>';
    return;
  }

  document.title = project.title + ' — Lesley Liu';
  titleEl.textContent = project.title;

  // Just the PDF board pages, laid out edge-to-edge — no intro/text slide.
  const slides = (project.boards && project.boards.length) ? project.boards : [project.image];
  slides.forEach(function (src) {
    const slide = document.createElement('div');
    slide.className = 'viewer-slide';
    const img = document.createElement('img');
    img.src = src;
    img.alt = project.title;
    // Board images have no intrinsic width until they load, so the
    // nearest-centered-slide calc below is unreliable until then —
    // recompute once each one finishes loading.
    img.addEventListener('load', function () { updateChrome(); });
    slide.appendChild(img);
    track.appendChild(slide);
  });

  // Final slide at the end of the strip — links on to the next project
  // (wrapping around after the last one).
  if (typeof PROJECTS !== 'undefined' && PROJECTS.length > 1) {
    const projectIndex = PROJECTS.findIndex(function (p) { return p.id === id; });
    const nextProject = PROJECTS[(projectIndex + 1) % PROJECTS.length];
    const nextSlide = document.createElement('a');
    nextSlide.className = 'viewer-next-slide';
    nextSlide.href = '/project-detail.html?id=' + nextProject.id;
    nextSlide.style.backgroundImage = "url('" + (nextProject.gridImage || nextProject.image) + "')";
    nextSlide.innerHTML =
      '<div class="viewer-next-slide-inner">' +
        '<div class="viewer-next-label">Next Project &#8594;</div>' +
        '<div class="viewer-next-title">' + nextProject.title + '</div>' +
      '</div>';
    track.appendChild(nextSlide);
  }

  const slideEls = track.children;

  // Which image is currently most centered in the viewport — used only to
  // drive the "n / total" counter and the disabled state of the arrows,
  // the scrolling itself is native and continuous.
  function currentIndex() {
    const center = wrap.scrollLeft + wrap.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    for (let i = 0; i < slideEls.length; i++) {
      const el = slideEls[i];
      const mid = el.offsetLeft + el.offsetWidth / 2;
      const dist = Math.abs(mid - center);
      if (dist < bestDist) { bestDist = dist; best = i; }
    }
    return best;
  }

  function updateChrome() {
    const idx = Math.min(currentIndex(), slides.length - 1);
    counterEl.textContent = (idx + 1) + ' / ' + slides.length;
    arrowPrev.disabled = wrap.scrollLeft <= 4;
    arrowNext.disabled = wrap.scrollLeft >= wrap.scrollWidth - wrap.clientWidth - 4;
  }

  function scrollToIndex(index) {
    const clamped = Math.max(0, Math.min(slideEls.length - 1, index));
    const el = slideEls[clamped];
    const target = el.offsetLeft + el.offsetWidth / 2 - wrap.clientWidth / 2;
    wrap.scrollTo({ left: target, behavior: 'smooth' });
  }

  arrowPrev.addEventListener('click', function () { scrollToIndex(currentIndex() - 1); });
  arrowNext.addEventListener('click', function () { scrollToIndex(currentIndex() + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') scrollToIndex(currentIndex() - 1);
    else if (e.key === 'ArrowRight') scrollToIndex(currentIndex() + 1);
    else if (e.key === 'Escape') location.href = '/portfolio-all.html';
  });

  let scrollTicking = false;
  wrap.addEventListener('scroll', function () {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function () { updateChrome(); scrollTicking = false; });
  });

  // Mouse-drag-to-scroll (touch already scrolls the container natively).
  let dragging = false, dragStartX = 0, dragStartScroll = 0;
  wrap.addEventListener('mousedown', function (e) {
    dragging = true;
    dragStartX = e.clientX;
    dragStartScroll = wrap.scrollLeft;
    wrap.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    wrap.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    wrap.classList.remove('dragging');
  });

  updateChrome();
})();
</script>
</body>
</html>
